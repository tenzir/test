title: Format-aware test output sorting
intro: >-
  Tenzir Test now keeps multiline record blocks intact when sorting test output, making
  nondeterministic event order easier to stabilize. The shell, Python fixture, and
  diff runners also apply pre-compare transforms consistently before comparing baselines.
